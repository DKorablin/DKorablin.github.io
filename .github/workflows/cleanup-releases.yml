name: Cleanup old releases

on:
  schedule:
    - cron: "0 3 1 */3 *"
  workflow_dispatch:
    inputs:
      keepCount:
        description: 'Number of old releases to keep'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Prune old releases
        env:
          # Scheduled runs have no inputs, so the default lives here as the fallback
          KEEP_COUNT: ${{ github.event.inputs.keepCount || '5' }}
        run: python scripts/prune_releases.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Prune old releases"
          git push origin main
