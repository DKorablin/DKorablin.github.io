name: Mirror to GitLab
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: mirror-gitlab

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_GITHUB_SYNC }}
        run: git push "https://oauth2:${GITLAB_TOKEN}@gitlab.com/DKorablin/dkorablin.gitlab.io.git" HEAD:main