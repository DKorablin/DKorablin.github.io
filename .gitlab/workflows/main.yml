stages: [deploy]

# Global so the description shows up when running a pipeline manually (job-level variables don't support it).
variables:
  KEEP_COUNT:
    value: "5"
    description: "Number of old releases to keep (used by prune-releases)"

# Builds the Jekyll site and publishes it to GitLab Pages (GitHub builds it on its own).
pages:
  stage: deploy
  image: ruby:3.3
  variables:
    JEKYLL_ENV: gitlab
    GIT_DEPTH: "1"
  script:
    - bundle install
    - bundle exec jekyll build -d public
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE != "schedule"

# Counterpart of .github/workflows/cleanup-releases.yml.
# Disabled unless ENABLE_PRUNE=true is set (CI/CD variable or pipeline schedule variable),
# so a mirrored copy of the repo doesn't diverge from its primary.
# Needs a masked CI/CD variable PRUNE_TOKEN: a project access token with write_repository
# that is allowed to push to the default branch. Schedule it with cron "0 3 1 */3 *".
prune-releases:
  stage: deploy
  image: python:3
  rules:
    - if: $ENABLE_PRUNE == "true" && ($CI_PIPELINE_SOURCE == "schedule" || $CI_PIPELINE_SOURCE == "web")
  script:
    - pip install pyyaml
    - python scripts/prune_releases.py
    - git config user.name "gitlab-ci[bot]"
    - git config user.email "gitlab-ci[bot]@users.noreply.gitlab.com"
    - git add .
    - |
      if git diff --cached --quiet; then
        echo "No changes to commit"
        exit 0
      fi
    - git commit -m "Prune old releases"
    - git push "https://prune-bot:${PRUNE_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
