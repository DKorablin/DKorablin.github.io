# Every project listed on the site. `id` must equal the project folder and its `_data/<id>.yml` release list.
# The folder only holds generated files: index.html and latest.json (empty front matter), README.md, assets/ and <tag>/.
# `group` is an `id` from `groups` in _config.yml; `icon` is 2-3 letters for the coloured tile.
- id: AutoClickerMaui
  title: AutoClicker
  group: apps
  icon: AC
  tagline: Record and replay taps on Android, with an optional AI agent
  platforms:
    - Android 5.0+
    - .NET MAUI

- id: FakeGpsMaui
  title: FakeGPS
  group: apps
  icon: GPS
  tagline: Mock GPS location and moving routes on Android
  platforms:
    - Android 5.0+
    - .NET MAUI

