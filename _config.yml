title: DKorablin repositories
description: The list of releases from some of private repositories

profiles:
  - id: github
    name: GitHub
    url: https://github.com/DKorablin
  - id: gitlab
    name: GitLab
    url: https://gitlab.com/DKorablin

# Sidebar/home-page sections. A project page joins one via its `group:` front matter.
groups:
  - id: apps
    name: Android apps
    color: "#1a7f64"
  - id: flatbed
    name: Flatbed hosts
    color: "#0969da"

defaults:
  -
    scope:
      path: ""   # applies to all files
    values:
      layout: default
  # Project folders hold only generated files; index.html and latest.json have empty front matter
  # and get their layout here. The project is the folder name, looked up in _data/projects.yml.
  -
    scope:
      path: "*/index.html"
    values:
      layout: project
  -
    scope:
      path: "*/latest.json"
    values:
      layout: latest-json

exclude:
- scripts/
- AGENTS.md
- README.md

# Project folders have both index.html and a README.md copied from the source repository;
# the README is pulled into the page by _layouts/project.html and must never become the index itself.
readme_index:
  enabled: false

sass:
  style: compressed