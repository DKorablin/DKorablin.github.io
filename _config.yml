title: DKorablin repositories
description: The list of releases from some of private repositories

profiles:
  - id: github
    name: GitHub
    url: https://github.com/DKorablin
  - id: gitlab
    name: GitLab
    url: https://gitlab.com/DKorablin

# Sidebar/home-page sections. A project page joins one via its `group:` front matter.
groups:
  - id: apps
    name: Android apps
    color: "#1a7f64"
  - id: flatbed
    name: Flatbed hosts
    color: "#0969da"

defaults:
  -
    scope:
      path: ""   # applies to all files
    values:
      layout: default

# Jekyll skips dot-folders. Publish every `.github` folder so a README copied as is into
# <Project>/ finds its images/videos at the same path (<Project>/.github/assets/...).
# `include` matches by folder name only, so the root .github is included too - its workflows are excluded below.
include:
- .github

exclude:
- .github/workflows
- scripts/
- AGENTS.md
- README.md

# Project folders have both index.html and a README.md copied from the source repository;
# the README is pulled into the page by _layouts/project.html and must never become the index itself.
readme_index:
  enabled: false

sass:
  style: compressed