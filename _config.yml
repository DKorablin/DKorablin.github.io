title: DKorablin repositories
description: The list of releases from some of private repositories

profiles:
  - id: github
    name: GitHub
    url: https://github.com/DKorablin
  - id: gitlab
    name: GitLab
    url: https://gitlab.com/DKorablin

# Sidebar/home-page sections. A project page joins one via its `group:` front matter.
groups:
  - id: apps
    name: Android apps
    color: "#1a7f64"
  - id: flatbed
    name: Flatbed hosts
    color: "#0969da"

defaults:
  -
    scope:
      path: ""   # applies to all files
    values:
      layout: default

exclude:
- scripts/
- AGENTS.md
- README.md

sass:
  style: compressed